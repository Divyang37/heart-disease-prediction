<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Heart Disease Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>❤️ Heart Disease Prediction</h1>

    <form action="/predict" method="post">

        <!-- Age Category -->
        <div class="form-group">
            <label>Age Category</label>
            <select name="AgeCategory">
                <option value="18-24">18-24</option>
                <option value="25-29">25-29</option>
                <option value="30-34">30-34</option>
                <option value="35-39">35-39</option>
                <option value="40-44">40-44</option>
                <option value="45-49">45-49</option>
                <option value="50-54">50-54</option>
                <option value="55-59">55-59</option>
                <option value="60-64">60-64</option>
                <option value="65-69">65-69</option>
                <option value="70-74">70-74</option>
                <option value="75-79">75-79</option>
                <option value="80 or older">80+</option>
            </select>
        </div>

        <!-- Binary Features -->
        <div class="form-group">
            <label>Difficulty Walking</label>
            <select name="DiffWalking">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </div>

        <div class="form-group">
            <label>Stroke</label>
            <select name="Stroke">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </div>

        <div class="form-group">
            <label>Physical Health (days)</label>
            <input type="number" name="PhysicalHealth" min="0" max="30" required>
        </div>

        <div class="form-group">
            <label>Diabetic</label>
            <select name="Diabetic">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
                <option value="Borderline">Borderline</option>
            </select>
        </div>

        <div class="form-group">
            <label>Kidney Disease</label>
            <select name="KidneyDisease">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </div>

        <div class="form-group">
            <label>Smoking</label>
            <select name="Smoking">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </div>

        <div class="form-group">
            <label>Physical Activity</label>
            <select name="PhysicalActivity">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </div>

        <div class="form-group">
            <label>Skin Cancer</label>
            <select name="SkinCancer">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </div>

        <!-- Sex -->
        <div class="form-group">
            <label>Sex</label>
            <select name="Sex">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>

        <!-- BMI -->
        <div class="form-group">
            <label>BMI</label>
            <input type="number" step="0.1" name="BMI" required>
        </div>

        <!-- Race -->
        <div class="form-group">
            <label>Race</label>
            <select name="Race">
                <option value="White">White</option>
                <option value="Black">Black</option>
                <option value="Asian">Asian</option>
                <option value="American Indian/Alaskan Native">American Indian</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <!-- Alcohol -->
        <div class="form-group">
            <label>Alcohol Drinking</label>
            <select name="AlcoholDrinking">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </div>

        <!-- Asthma -->
        <div class="form-group">
            <label>Asthma</label>
            <select name="Asthma">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </div>

        <!-- Mental Health -->
        <div class="form-group">
            <label>Mental Health (days)</label>
            <input type="number" name="MentalHealth" min="0" max="30" required>
        </div>

        <button type="submit">Predict</button>

    </form>

    {% if prediction_text %}
        <div class="result">
            <h2>{{ prediction_text }}</h2>
        </div>
    {% endif %}

</div>

</body>
</html>
