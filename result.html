<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Heart Disease Prediction Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>🧠 Prediction Result</h1>

    <div class="result-box">

        {% if "High" in prediction_text %}
            <h2 style="color: red;">{{ prediction_text }}</h2>
        {% else %}
            <h2 style="color: green;">{{ prediction_text }}</h2>
        {% endif %}

        {% if probability %}
            <p style="font-size: 18px; margin-top: 10px;">
                Risk Probability: <strong>{{ probability }}%</strong>
            </p>
        {% endif %}

    </div>

    <br>

    <a href="/" class="back-btn">🔙 Go Back</a>

</div>

</body>
</html>
